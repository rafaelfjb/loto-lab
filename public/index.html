  const money=value=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(value);
  const dialog=$('#drawDialog');
  dialog.innerHTML=`<div class="modal-head"><h2>Concurso ${esc(d.numero)}</h2><button class="xbtn" data-action="close-dialog" aria-label="Fechar">×</button></div><p class="muted" style="font-size:10px">${esc(dateLabel(d.data))} · Origem: ${esc(d.source||data.health?.source||'não informada')}</p><div class="ballrow">${balls(d.dezenas)}</div><div class="insightgrid"><div class="tile"><span>Soma</span><strong>${sum(d.dezenas)}</strong></div><div class="tile"><span>Pares / ímpares</span><strong>${d.dezenas.filter(n=>n%2===0).length} / ${d.dezenas.filter(n=>n%2===1).length}</strong></div><div class="tile"><span>Repetidas do registro anterior</span><strong>${prev?repeated.length:'—'}</strong></div></div>${d.premiacao?`<section style="margin-top:16px"><div class="card-head"><h3>Rateio informado na planilha</h3><span>Valores por faixa</span></div><div class="tablewrap"><table class="table" style="min-width:0"><thead><tr><th>Acertos</th><th>Ganhadores</th><th>Rateio</th></tr></thead><tbody>${[15,14,13,12,11].filter(t=>d.premiacao[t]).map(t=>`<tr><td>${t}</td><td>${d.premiacao[t].ganhadores??'—'}</td><td>${d.premiacao[t].rateio===null?'—':money(d.premiacao[t].rateio)}</td></tr>`).join('')}</tbody></table></div></section>`:''}${d.estimativaPremio!==undefined||d.acumulado15!==undefined||d.acumuladoEspecial!==undefined||d.arrecadacaoTotal!==undefined?`<div class="insightgrid" style="margin-top:10px">${d.estimativaPremio!==undefined?`<div class="tile"><span>Estimativa do próximo prêmio</span><strong>${money(d.estimativaPremio)}</strong></div>`:''}${d.acumulado15!==undefined?`<div class="tile"><span>Acumulado de 15 acertos</span><strong>${money(d.acumulado15)}</strong></div>`:''}${d.acumuladoEspecial!==undefined?`<div class="tile"><span>Acumulado especial Lotofácil da Independência</span><strong>${money(d.acumuladoEspecial)}</strong></div>`:''}${d.arrecadacaoTotal!==undefined?`<div class="tile"><span>Arrecadação total</span><strong>${money(d.arrecadacaoTotal)}</strong></div>`:''}</div>`:''}${d.cidadeUf?`<p class="muted" style="font-size:10px;margin:12px 0 0"><b>Localidade informada:</b> ${esc(d.cidadeUf)}</p>`:''}${d.observacao?`<p class="muted" style="font-size:10px;margin:8px 0 0"><b>Observação:</b> ${esc(d.observacao)}</p>`:''}<p class="muted" style="font-size:9px;margin-top:14px">Atualização do registro: ${esc(d.updatedAt?new Date(d.updatedAt).toLocaleString('pt-BR'):'não informada')}.</p>`;
  dialog.showModal()
}
function applyFilters(resetPage=true){const n=$('#filterNumber')?.value.trim()||'',from=$('#filterFrom')?.value||'',to=$('#filterTo')?.value||'',text=$('#filterText')?.value.trim()||'';data.filteredDraws=data.draws.filter(d=>(!n||String(d.numero)===n)&&(!from||String(d.iso||'')>=from)&&(!to||String(d.iso||'')<=to)&&(!text||d.dezenas.some(x=>pad(x).includes(text)||String(x)===text)));if(resetPage)data.resultsPage=1;renderDrawTable()}
function parseMatrix(rows){
  const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
  const normalized=rows.map(r=>r.map(norm));
  let headerIndex=-1,head=[],ni=-1,di=-1,drawIndex=-1,ballIndices=[];
  for(let i=0;i<Math.min(rows.length,30);i++){
    const h=normalized[i],n=h.findIndex(x=>['concurso','numero','numerodoconcurso'].includes(x)),d=h.findIndex(x=>['data','datasorteio','dataconcurso'].includes(x));
    const balls=h.map((x,j)=>/^bola\d+$/.test(x)?{j,num:Number(x.slice(4))}:null).filter(Boolean).sort((a,b)=>a.num-b.num);
    const draw=h.findIndex(x=>['dezenas','resultado','numeros','bolas'].includes(x));
    if(n>=0&&d>=0&&(balls.length>=15||draw>=0)){headerIndex=i;head=h;ni=n;di=d;drawIndex=draw;ballIndices=balls.slice(0,15).map(x=>x.j);break}
  }
  if(headerIndex<0)throw new Error('Cabeçalhos não reconhecidos. Esperado: Concurso, Data Sorteio e Bola1 até Bola15, ou coluna dezenas no CSV.');
  const numberFromMoney=value=>{const s=String(value??'').trim().replace(/R\$\s*/i,'').replace(/\s/g,'');if(!s)return null;const n=Number(s.includes(',')?s.replace(/\./g,'').replace(',','.'):s);return Number.isFinite(n)?n:null};
  const valid=[];
  for(const row of rows.slice(headerIndex+1)){
    const numero=Number(String(row[ni]??'').trim());if(!Number.isInteger(numero)||numero<1)continue;
    const rawNumbers=drawIndex>=0?(String(row[drawIndex]??'').match(/\d+/g)||[]).map(Number):ballIndices.map(j=>Number(String(row[j]??'').trim()));
    const dezenas=rawNumbers;
    if(dezenas.length!==15||dezenas.some(n=>!Number.isInteger(n)||n<1||n>25)||new Set(dezenas).size!==15)throw new Error(`Concurso ${numero}: esperado exatamente 15 dezenas únicas entre 01 e 25.`);
    const raw=String(row[di]??'').trim();let iso='',data='';
    if(/^\d{1,5}(?:\.\d+)?$/.test(raw)&&Number(raw)>=20000&&Number(raw)<=80000){iso=new Date(Math.round((Number(raw)-25569)*86400000)).toISOString().slice(0,10);data=`${iso.slice(8,10)}/${iso.slice(5,7)}/${iso.slice(0,4)}`}
    else{const m=raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);iso=m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:raw.slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(iso)||Number.isNaN(Date.parse(iso+'T12:00:00')))throw new Error(`Data inválida no concurso ${numero}: ${raw}`);data=`${iso.slice(8,10)}/${iso.slice(5,7)}/${iso.slice(0,4)}`}
    const item={lotteryId:'lotofacil',numero,data,iso,dezenas:dezenas.sort((a,b)=>a-b)};
    const tiers={};
    for(const tier of [15,14,13,12,11]){const wi=head.findIndex(x=>x===`ganhadores${tier}acertos`),ai=head.findIndex(x=>x===`rateio${tier}acertos`);if(wi>=0||ai>=0){const rawW=wi>=0?String(row[wi]??'').trim():'';tiers[tier]={ganhadores:rawW?Number(rawW.replace(/\D/g,'')):null,rateio:ai>=0?numberFromMoney(row[ai]):null}}}
    if(Object.keys(tiers).length)item.premiacao=tiers;
    const estimate=head.findIndex(x=>x.startsWith('estimativapremio'));if(estimate>=0&&numberFromMoney(row[estimate])!==null)item.estimativaPremio=numberFromMoney(row[estimate]);
    const accumulated=head.findIndex(x=>x==='acumulado15acertos');if(accumulated>=0&&numberFromMoney(row[accumulated])!==null)item.acumulado15=numberFromMoney(row[accumulated]);
    const special=head.findIndex(x=>x.startsWith('acumuladosorteioespecial'));if(special>=0&&numberFromMoney(row[special])!==null)item.acumuladoEspecial=numberFromMoney(row[special]);
    const arrecadacao=head.findIndex(x=>x==='arrecadacaototal');if(arrecadacao>=0&&numberFromMoney(row[arrecadacao])!==null)item.arrecadacaoTotal=numberFromMoney(row[arrecadacao]);
    const city=head.findIndex(x=>x==='cidadeuf');if(city>=0&&String(row[city]??'').trim())item.cidadeUf=String(row[city]).trim();
    const observation=head.findIndex(x=>x==='observacao');if(observation>=0&&String(row[observation]??'').trim())item.observacao=String(row[observation]).trim();
    valid.push(item)
  }
  if(!valid.length)throw new Error('Nenhuma linha de concurso válida foi encontrada.');
  return valid
}
function parseCSV(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(!lines.length)throw new Error('O CSV está vazio.');const sep=(lines[0].match(/;/g)||[]).length>(lines[0].match(/,/g)||[]).length?';':',';return parseMatrix(lines.map(line=>{let out=[],v='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){v+='"';i++}else q=!q}else if(c===sep&&!q){out.push(v.trim());v=''}else v+=c}out.push(v.trim());return out}))}
async function importFile(file){if(file.size>15*1024*1024){toast('O arquivo ultrapassa o limite de 15 MB.');return}try{const isXlsx=/\.xlsx$/i.test(file.name)||file.type==='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';const parsed=isXlsx?parseMatrix(await window.readCaixaWorkbook(file)):parseCSV(await file.text());const source=prompt('Informe a origem do arquivo. O conteúdo não será verificado automaticamente contra a CAIXA:','CAIXA (arquivo obtido manualmente)');const map=new Map(data.localDraws.map(d=>[Number(d.numero),d]));for(const d of parsed)map.set(d.numero,{...d,source:source?.trim()||'Origem não informada (não verificada)',sourceVerification:'not-verified',updatedAt:new Date().toISOString()});data.localDraws=[...map.values()].sort((a,b)=>a.numero-b.numero);data.draws=data.localDraws;raceCache.source=null;raceIndex=0;data.sourceMode='local';data.health={source:source?.trim()||'Origem não informada (não verificada)',updatedAt:new Date().toISOString()};saveLocal();render();toast(`${parsed.length} resultado(s) importado(s) neste dispositivo.`)}catch(error){toast(error?.message||'Não foi possível ler este arquivo.')}}
function downloadTemplate(){const content='concurso,data,dezenas\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));a.download='modelo-importacao-lotolab.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function saveGame(){const target=data.targetPicks;if(data.selected.length!==target){toast(`Este jogo precisa ter exatamente ${target} dezenas. Use “Complete o jogo” ou ajuste a seleção.`);return}const game={id:data.editing||crypto.randomUUID?.()||String(Date.now()),nome:$('#gameName').value.trim(),observacao:$('#gameNote').value.trim(),dezenas:[...data.selected].sort((a,b)=>a-b),updatedAt:new Date().toISOString()};if(data.editing)data.games=data.games.map(g=>g.id===data.editing?game:g);else data.games.push(game);data.selected=[];data.editing=null;data.targetPicks=15;saveLocal();render();toast('Jogo salvo neste dispositivo.')}
function randomFifteen(){const pool=Array.from({length:rules.universe},(_,i)=>i+1);for(let i=0;i<rules.drawCount;i++){const j=i+Math.floor(Math.random()*(pool.length-i));[pool[i],pool[j]]=[pool[j],pool[i]]}return pool.slice(0,rules.drawCount).sort((a,b)=>a-b)}
function generateGameSet(){const input=$('#gameSetCount'),quantity=Number(input?.value);if(!Number.isInteger(quantity)||quantity<1||quantity>100){toast('Informe uma quantidade inteira entre 1 e 100.');return}const used=new Set(data.games.filter(g=>Array.isArray(g.dezenas)&&g.dezenas.length===rules.drawCount).map(g=>g.dezenas.map(Number).sort((a,b)=>a-b).join('-'))),generated=[],batchName=`Conjunto aleatório · ${new Date().toLocaleString('pt-BR')}`;let attempts=0;while(generated.length<quantity&&attempts<quantity*100){attempts++;const dezenas=randomFifteen(),key=dezenas.join('-');if(used.has(key))continue;used.add(key);generated.push({id:crypto.randomUUID?.()||`${Date.now()}-${generated.length}-${Math.random()}`,nome:`${batchName} · jogo ${String(generated.length+1).padStart(2,'0')}`,observacao:'Gerado aleatoriamente',dezenas,updatedAt:new Date().toISOString()})}if(!generated.length){toast('Não foi possível gerar jogos inéditos.');return}const previous=data.games;data.games=[...data.games,...generated];try{saveLocal()}catch{data.games=previous;toast('Não foi possível salvar o conjunto neste dispositivo. Libere espaço no navegador e tente novamente.');return}render();toast(generated.length===quantity?`${generated.length} jogos aleatórios gerados e salvos.`:`Foram gerados e salvos ${generated.length} de ${quantity} jogos; não foi possível completar a quantidade sem repetir combinações.`)}
function completeGame(){const target=data.targetPicks;if(data.selected.length>target){toast(`Remova ${data.selected.length-target} dezena(s) para completar este jogo.`);return}const missing=target-data.selected.length;if(!missing){toast(`O jogo já está completo com ${target} dezenas.`);return}const pool=Array.from({length:rules.universe},(_,i)=>i+1).filter(n=>!data.selected.includes(n));for(let i=0;i<missing;i++){const j=i+Math.floor(Math.random()*(pool.length-i));[pool[i],pool[j]]=[pool[j],pool[i]]}data.selected=[...data.selected,...pool.slice(0,missing)].sort((a,b)=>a-b);updateBoard();toast(`${missing} dezena(s) aleatória(s) adicionada(s).`)}
function setGameTarget(value){const target=Number(value);if(!Number.isInteger(target)||target<rules.minPicks||target>rules.maxPicks)return;if(data.selected.length>target){toast(`Você já marcou ${data.selected.length} dezenas. Remova algumas antes de reduzir a quantidade.`);const select=$('#gameTarget');if(select)select.value=String(data.targetPicks);return}data.targetPicks=target;updateBoard()}
function updateBoard(){document.querySelectorAll('#numberBoard .pick').forEach(b=>{const on=data.selected.includes(Number(b.dataset.value));b.classList.toggle('selected',on);b.setAttribute('aria-pressed',String(on))});const pc=$('#pickCount');if(pc)pc.textContent=`${data.selected.length} de ${data.targetPicks} dezenas selecionadas`;const target=$('#gameTarget');if(target)target.value=String(data.targetPicks)}
function checkGames(){const n=Number($('#drawSelect')?.value),draw=data.draws.find(d=>Number(d.numero)===n),out=$('#checkOutput');if(!draw){toast('Escolha um concurso disponível.');return}if(!data.games.length){out.innerHTML='<div class="empty">Salve ao menos um jogo para conferir.</div>';return}out.innerHTML=data.games.map(g=>{const hits=g.dezenas.filter(x=>draw.dezenas.includes(x));return `<div class="hit"><b>${esc(g.nome||'Jogo sem nome')}: ${hits.length} acerto${hits.length===1?'':'s'}</b><p>Dezenas: ${hits.length?hits.map(pad).join(' · '):'nenhuma'}</p></div>`}).join('')}
function printGames(){if(!data.games.length){toast('Não há jogos salvos para imprimir.');return}$('#printArea').innerHTML=`<h1>LotoLab — jogos para preenchimento</h1><p>Folha de referência pessoal · Lotofácil</p>${data.games.map(g=>`<section class="ticket"><h2>${esc(g.nome||'Jogo sem nome')}</h2>${g.observacao?`<p>${esc(g.observacao)}</p>`:''}<div class="ticket-grid">${Array.from({length:25},(_,i)=>`<span class="ticket-number" style="${g.dezenas.includes(i+1)?'background:#f4e179;border-color:#85298d;color:#541e64':''}">${pad(i+1)}</span>`).join('')}</div><p>Dezenas selecionadas: ${g.dezenas.map(pad).join(' · ')}</p></section>`).join('')}<p class="print-disclaimer">Esta impressão não é bilhete oficial nem comprova uma aposta. Use-a apenas como referência para preencher o volante oficial na lotérica. Confira as regras e o resultado nos canais oficiais da CAIXA.</p>`;window.print()}
function toast(text){const t=$('#toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function render(){stopRace();if(data.view!=='stats')cancelCombinationAnalysis();for(const id of ['home','results','stats','games']){$('#'+id).classList.toggle('active',data.view===id);$('#'+id).innerHTML=id==='home'?dashboard():id==='results'?resultsPanel():id==='stats'?statsPanel():gamesPanel()}if(data.view==='stats'&&data.draws.length){drawRace(raceIndex);const statsDraws=sortedDraws();renderCombinationAnalysis(statsDraws,Number($('#comboSize')?.value)||2);renderSequenceAnalysis(statsDraws,Number($('#sequenceSize')?.value)||2)}renderDrawTable();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===data.view));const c=$('#connection');const dot=data.sourceMode==='mongo'?'ok':'';c.innerHTML=`<i class="dot ${dot}"></i><span>${esc(data.sourceMode==='mongo'?'Banco conectado':data.sourceMode==='seed'?'Planilha carregada':data.sourceMode==='local'?'Dados locais':data.sourceMode==='error'?'Servidor indisponível':'Sem conexão oficial')}</span>`}
async function useLocalOrSeed(){if(data.localDraws.length){data.draws=data.localDraws;data.sourceMode='local';return}data.draws=Array.isArray(window.LOTOLAB_INITIAL_DRAWS)?window.LOTOLAB_INITIAL_DRAWS:[];data.sourceMode=data.draws.length?'seed':'empty';if(data.sourceMode==='seed')data.health={source:'Planilha XLSX fornecida pelo usuário (origem declarada CAIXA; não verificada independentemente)',updatedAt:null}}
async function loadData(){loadLocal();if(location.protocol==='file:'){useLocalOrSeed();render();return}try{const h=await fetch('/api/health',{headers:{accept:'application/json'}});if(!h.ok)throw new Error('health');data.health=await h.json();const r=await fetch('/api/draws?lottery=lotofacil',{headers:{accept:'application/json'}});if(!r.ok)throw new Error('draws');const result=await r.json();if(Array.isArray(result.draws)&&result.storage==='mongodb'&&result.draws.length){data.draws=result.draws;data.sourceMode='mongo'}else useLocalOrSeed()}catch{useLocalOrSeed();if(!data.draws.length)data.sourceMode='error'}render()}
$('#drawDialog').addEventListener('click',e=>{if(e.target===$('#drawDialog'))$('#drawDialog').close()});document.addEventListener('click',e=>{const view=e.target.closest('[data-view]');if(view){data.view=view.dataset.view;render();window.scrollTo({top:0,behavior:'smooth'});return}const b=e.target.closest('[data-action]');if(!b)return;const id=b.dataset.value;switch(b.dataset.action){case'show-draw':showDraw(id);break;case'home-prev':selectHomeDraw(id);break;case'home-next':selectHomeDraw(id);break;case'race-toggle':toggleRace();break;case'race-start':stopRace();drawRace(0);break;case'race-end':stopRace();drawRace(getRaceFrames().draws.length-1);break;case'close-dialog':$('#drawDialog').close();break;case'draw-page':data.resultsPage=Number(id)||1;applyFilters(false);break;case'choose-csv':$('#csvFile').click();break;case'template':downloadTemplate();break;case'toggle-number':{const n=Number(id);if(data.selected.includes(n))data.selected=data.selected.filter(x=>x!==n);else if(data.selected.length<data.targetPicks)data.selected=[...data.selected,n].sort((a,b)=>a-b);else toast(`Este jogo está configurado para ${data.targetPicks} dezenas.`);updateBoard();break}case'complete-game':completeGame();break;case'generate-game-set':generateGameSet();break;case'clear-picks':data.selected=[];updateBoard();break;case'save-game':saveGame();break;case'cancel-edit':data.editing=null;data.selected=[];data.targetPicks=15;render();break;case'edit-game':{const g=data.games.find(x=>x.id===id);if(g){data.editing=id;data.selected=[...g.dezenas];data.targetPicks=g.dezenas.length;data.view='games';render();window.scrollTo({top:0,behavior:'smooth'})}break}case'delete-game':if(confirm('Excluir este jogo salvo deste dispositivo?')){data.games=data.games.filter(g=>g.id!==id);saveLocal();render();toast('Jogo excluído.')}break;case'check-games':checkGames();break;case'print-games':printGames();break}}
);document.addEventListener('input',e=>{if(['filterNumber','filterFrom','filterTo','filterText'].includes(e.target.id))applyFilters();if(e.target.id==='raceSlider')drawRace(Number(e.target.value))});document.addEventListener('change',e=>{if(e.target.id==='gameTarget')setGameTarget(e.target.value);if(e.target.id==='comboSize')renderCombinationAnalysis(sortedDraws(),Number(e.target.value)||2);if(e.target.id==='sequenceSize')renderSequenceAnalysis(sortedDraws(),Number(e.target.value)||2);if(e.target.id==='csvFile'&&e.target.files?.[0]){const input=e.target;importFile(input.files[0]).finally(()=>{input.value=''})}});
